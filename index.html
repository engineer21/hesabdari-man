<script>
    if (localStorage.getItem('farzad_v2_theme') === 'dark') {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
        if (!localStorage.getItem('farzad_v2_theme')) {
            localStorage.setItem('farzad_v2_theme', 'light');
        }
    }
</script>
